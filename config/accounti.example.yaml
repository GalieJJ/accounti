# accounti Konfiguration
# Kopiere diese Datei nach config/accounti.yaml und passe sie an.

# Datenbank
database:
  url: "postgresql://accounti:accounti@localhost:5432/accounti"

# Mandant
mandant:
  name: "Meine Firma GmbH"
  kontenrahmen: SKR03          # SKR03 oder SKR04
  sachkonten_laenge: 4         # 4 oder 6

  # Für Ausgangsrechnungen (XRechnung verlangt Anschrift, Kontakt, E-Mail und Bank)
  kuerzel: "MF"                # Schlüssel des Nummernkreises (je Gesellschaft)
  anschrift:
    strasse: "Musterstraße 1"
    plz: "12345"
    ort: "Musterstadt"
    land: DE
  ust_id: "DE123456789"        # USt-IdNr. und/oder Steuernummer
  steuernummer: "12/345/67890"
  email: "rechnung@meine-firma.example"   # elektronische Adresse (BT-34)
  kontakt:
    name: "Erika Muster"
    telefon: "0123 456789"
    email: "buchhaltung@meine-firma.example"
  bank:
    iban: "DE89 3704 0044 0532 0130 00"
    bic: "COBADEFFXXX"
  oss: false                   # OSS-registriert? Dann zahlen EU-Privatkunden ihren Landessatz
  rechnung:
    nummernformat: "{jahr}-{nummer:04d}"   # lückenlos je Kürzel und Jahr
    zahlungsziel_tage: 14

# DATEV-Export
datev:
  berater_nummer: "12345"
  mandanten_nummer: "00001"
  wirtschaftsjahr_beginn: "2026-01-01"

# Marktplätze & Zahlungsdienstleister (optional — ohne Abschnitt gelten diese Werte, SKR03)
integrationen:
  erloes_inland: { "19": "8400", "7": "8300" }
  bu_inland: { "19": 3, "7": 2 }
  erloes_ig_lieferung: "8125"   # B2B mit USt-IdNr. (zur Prüfung)
  erloes_ausfuhr: "8120"        # Drittland (zur Prüfung: Ausfuhrnachweis)
  erloes_unbekannt: "8200"      # Bestimmungsland fehlt (zur Prüfung)
  geldtransit_konto: "1360"
  auszahlung_toleranz_tage: 10  # Bankeingang bis so viele Tage nach dem Auszahlungsdatum
  ermaessigte_artikel: []       # SKUs mit ermäßigtem Satz
  oss_erloes_ermaessigt: {}     # Land → Erlöskonto für ermäßigte OSS-Umsätze, z.B. { FR: "8330" } (anlegen)
  eu_fernverkaeufe_sonstige: {} # Jahr → EU-Fernverkäufe netto außerhalb der Marktplätze, z.B. { 2025: 12000 }
  paypal_kontobezeichnung: "PPLXLULL/PAYPAL"   # Feld :25: im MT940 des PayPal-Kontos
  marktplaetze:                 # nur Abweichungen angeben; Konten 1361–1363/1210 anlegen
    amazon:
      verrechnungskonto: "1361"
      bank_stichworte: ["AMAZON"]
      ust_gebuehren: vorsteuer  # vorsteuer | 13b (mit bu_gebuehren) | ohne — Amazon seit 08/2024 mit deutscher USt
      ust_werbung: null         # Werbung getrennt einstellen (nicht eingestellt → zur Prüfung)
      lager_nur_inland: false   # true: FBA nur aus deutschen Lagern (kein Pan-EU/CEE)
    ebay:    { verrechnungskonto: "1362", ust_gebuehren: null }   # mit dem Berater klären
    shopify: { verrechnungskonto: "1363", verkaufsgebuehr: "4970", ust_gebuehren: null }
    paypal:  { verrechnungskonto: "1210", verkaufsgebuehr: "4970", ust_gebuehren: ohne }

# KI-Klassifikation
llm:
  # Provider: anthropic, openai, ollama
  provider: "anthropic"
  model: "claude-sonnet-4-20250514"
  api_key: "${ANTHROPIC_API_KEY}"    # Umgebungsvariable

  # Ab welcher Confidence automatisch buchen (0.0-1.0)?
  auto_buchen_schwelle: 0.95

  # Ab welcher Confidence zur Prüfung vorlegen (darunter = manuell)?
  pruefung_schwelle: 0.70

# Import-Einstellungen
import:
  # Standard-Bankformat (wenn --format=auto)
  standard_bank: "sparkasse"

  # Duplikaterkennung
  duplikat_check: true

# Buchhaltung (optional — ohne diesen Abschnitt gelten die Standards)
buchhaltung:
  debitoren_von: 10000         # Personenkontenkreise (SKR03 und SKR04)
  debitoren_bis: 69999
  kreditoren_von: 70000
  kreditoren_bis: 99999
  bank_konto: "1200"
  standard_aufwand: "4900"     # wenn weder Kontakt noch Regelwerk ein Sachkonto kennt (→ Prüfung)
  standard_zahlungsziel_tage: 14
  skonto_karenz_tage: 3        # Skonto gilt noch, wenn die Bank bis zu 3 Tage später bucht
  skonto_erhalten: {"19": "3736", "7": "3731", "0": "3730"}   # SKR03
  skonto_gewaehrt: {"19": "8736", "7": "8731", "0": "8730"}

# USt-IdNr.-Bestätigung beim BZSt (optional — eigene USt-IdNr. aus mandant.ust_id)
ustid_pruefung:
  max_alter_tage: 30           # so lange vor dem Rechnungsdatum gilt eine Bestätigung
  timeout_sekunden: 60         # Rückfragen beim Mitgliedstaat können dauern
  # url: https://api.evatr.vies.bzst.de/app/v1/abfrage   # oder ACCOUNTI_EVATR_URL

# Beleg-Kanäle (optional — ohne diesen Abschnitt gibt es nur Ordner und Upload)
belegkanaele:
  max_groesse_mb: 25           # je Datei; der Typ wird am Inhalt geprüft
  dateitypen: [pdf, xml, jpeg, png, tiff]
  email:                       # accounti belege abholen --kanal email
    - name: rechnungen
      host: "imap.meine-firma.example"
      port: 993
      verschluesselung: ssl    # ssl, starttls oder keine (nur localhost)
      benutzer: "rechnungen@meine-firma.example"
      passwort: "${ACCOUNTI_IMAP_PASSWORT}"   # oder: accounti kanaele zugang email rechnungen
      ordner: INBOX
      # ab: 2026-01-01          # ältere Nachrichten nicht abholen
      nach_abholen: belassen   # belassen, gelesen oder verschieben (dann ziel_ordner)
      # ziel_ordner: "Belege/abgeholt"
      # ca_datei: /etc/ssl/firma-ca.pem   # eigene CA des Mailservers
  webhook:                     # accounti kanaele webhook starten
    host: "127.0.0.1"          # TLS über einen Reverse-Proxy davor
    port: 8410
    max_dateien: 10
    max_anfrage_mb: 60
  connectoren:                 # accounti belege abholen --kanal connector
    # Beispiel nach der OpenAPI-Doku von GetMyInvoices (v3) — nicht gegen ein Konto geprüft
    - name: getmyinvoices
      typ: json
      basis_url: "https://api.getmyinvoices.com/accounts/v3"
      kopfzeilen:
        X-API-KEY: "{zugang}"  # accounti kanaele zugang connector getmyinvoices
        User-Agent: "accounti (Konto 12345)"   # verlangt einen eindeutigen User-Agent
      liste:
        pfad: /documents
        parameter: {perPage: "100", archivedFilter: "1"}
        eintraege: records
        seite_parameter: pageNumber
        # max_seiten: 50       # mehr Seiten → Fehler (Exit 1), dann erhöhen
      felder: {id: documentUid, dateiname: filename, absender: companyName}
      datei:
        pfad: "/documents/{id}"
        parameter: {includeDocument: "true"}
        inhalt: fileContent    # Base64 in der JSON-Antwort

# Anlagenbuchhaltung (optional — ohne diesen Abschnitt gelten die Standards des Kontenrahmens
# aus buchhaltung.kontenrahmen; hier SKR03)
anlagen:
  # rechtsstand: config/rechtsstand.yaml   # eigene Grenzbeträge/AfA-Tabelle (ergänzt den Stand)
  konten:
    afa: "4830"                  # Abschreibungen auf Sachanlagen
    afa_kfz: "4832"
    afa_immateriell: "4822"
    gwg_afa: "4855"              # Sofortabschreibung GWG
    sammelposten_afa: "4862"
    gwg: "0480"                  # Anlagekonto GWG
    sammelposten: "0485"         # Anlagekonto Sammelposten
    abgang_buchverlust: "2310"   # Restbuchwert
    abgang_buchgewinn: "2315"
    erloes_buchverlust: "8801"   # 19 % USt
    erloes_buchgewinn: "8820"
    erloes_buchverlust_ohne_ust: "8800"
    erloes_buchgewinn_ohne_ust: "8829"
  kfz_konten: ["0320", "0350"]       # AfA auf afa_kfz
  immaterielle_konten: [["0010", "0049"]]   # AfA auf afa_immateriell
  anlagekonten: [["0010", "0499"]]   # Buchungen hierauf ohne Anlagegut → anlagen vorschlaege

# Jahresabschluss (optional)
abschluss:
  gewinnermittlung: euer         # euer oder bilanz (nur bei bilanz: ARAP/PRAP)
  ergebnis_konto: "0880"         # Kapitalkonto für Ergebnis und Privatkonten (SKR04: 2010)
  rap_verzicht_bis_gwg: false    # § 5 Abs. 5 Satz 2 EStG, einheitlich für alle
  verrechnungskonten: ["1360", "1590", "1792"]   # sollen zum Stichtag ausgeglichen sein
  # kontenzuordnung: config/kontenzuordnung.yaml   # eigene Kontoarten/EÜR-Zuordnung

# Kassenbuch (optional)
kasse:
  konto: "1000"                  # SKR04: 1600

# Zahlungsverkehr (optional — ohne diesen Abschnitt gelten die Standards)
zahlung:
  vorlauf_tage: 3              # Skontofristen und Fälligkeiten so weit voraus einplanen
  skonto_ziehen: true          # Skonto nutzen, solange die Frist läuft
  # mindestbetrag: 1.00        # Vorschlag: kleinere Posten weglassen
  # hoechstbetrag: 50000.00    # Vorschlag: größere Posten weglassen
  # hoechstbetrag_zahlung: 25000.00   # Prüfung: größere Einzelzahlungen blockieren
  vier_augen: false            # true: zwei verschiedene Personen (Anmeldename) geben frei
  # freigeber: [erika, jan]    # nur diese Anmeldenamen dürfen freigeben
  einzelbuchung: true          # BtchBookg=false — wirkt nur mit Vereinbarung mit der Bank
  # auftraggeber:              # Standard: mandant.name und mandant.bank
  #   name: "Meine Firma GmbH"
  #   iban: "DE89 3704 0044 0532 0130 00"
  #   bic: "COBADEFFXXX"

# Mahnwesen (optional — Mahngebühren sind Konfiguration, keine Rechtsberatung)
mahnwesen:
  karenztage: 3                # so lange nach Fälligkeit wird nicht gemahnt
  mindestbetrag: 10.00         # kleinere Reste nicht mahnen
  stufenabstand_tage: 7        # Mindestabstand zum Versand der letzten Mahnung (und deren Frist abgelaufen)
  zahlungsfrist_tage: 10       # neue Frist im Mahnschreiben
  entwurf_gueltig_tage: 3      # so lange nach dem Mahndatum darf ein Entwurf noch raus
  zahlungsziel_vereinbart: false  # true: Zahlungsziele vertraglich vereinbart → Verzug ab Fälligkeit
  zugang_tage: 3               # Versand → Zugang einer Mahnung (Verzug durch Mahnung)
  hinweis_30_tage: false       # true: Rechnungen an Verbraucher weisen auf § 286 Abs. 3 BGB hin
  unbekannt_als: verbraucher   # oder unternehmer — wenn weder Kontakt noch Rechnung es sagen
  pauschale_b2b: 40.00         # § 288 Abs. 5 BGB
  pauschale_anrechnen: true    # Mahngebühren nur, soweit sie die Pauschale übersteigen
  stufen:
    - name: Zahlungserinnerung
      ab_tagen: 5
      gebuehr: 0.00
      verzugszinsen: false
    - name: 1. Mahnung
      ab_tagen: 14
      gebuehr: 5.00              # nur verlangt, wenn die Mahnung im Verzug hinausgeht
      verzugszinsen: true
    - name: 2. Mahnung
      ab_tagen: 28
      gebuehr: 10.00
      verzugszinsen: true
      # text: "…{nummer} … {summe} … bis zum {frist} …"   # eigener Brieftext; Platzhalter:
      #   {kunde} {nummer} {datum} {faellig} {betrag} {summe} {frist} {firma} {stufe}
  # basiszinssaetze:           # neue Sätze nach Bekanntgabe der Bundesbank
  #   - ab: 2027-01-01
  #     satz: 1.52

# Aufgaben & Rückfragen (optional — ohne diesen Abschnitt gelten die Standards)
aufgaben:
  ich: "jan"                     # für --zustaendig ich (sonst ACCOUNTI_BENUTZER bzw. Login-Name)
  rollen:
    buchhaltung: [jan, erika]
  zustaendigkeit:                # erste passende Regel gewinnt; ohne Treffer: gemeinsame Liste
    - wenn: {art: bank_freigabe}
      an: jan
    - wenn: {art: "beleg_*", bankkonto: "DE12*"}   # Merkmale: bankkonto, gegenpartei, kanal, …
      rolle: buchhaltung
  fristen:                       # Tage bis zur Fälligkeit je Art
    standard: 7
    beleg_fehlt: 10              # ab Umsatzdatum (GoBD Rz. 47: zehn Tage unbedenklich)
    kontierung_pruefen: 10
    bank_freigabe: 0
  erinnerung:
    stufen: [0, 3, 7]            # Tage nach Fälligkeit: fällig, 1. Erinnerung, letzte Stufe
    eskalation_an: "@leitung"    # optional: Benutzer oder @rolle bekommt die letzte Stufe in Kopie
    arten:
      beleg_fehlt: {stufen: [0, 7, 14]}
  pruefung:
    kontierung_schwelle: 0.95    # darunter wird eine Buchung zur Aufgabe
    beleg_fehlt_ab_betrag: 0.00
    beleg_fehlt_nach_tagen: 0
    abgeschaltet: []             # z.B. [kontakt_pruefen]
  benachrichtigung:
    kanaele: [email]             # email (SMTP aus 'versand'), webhook
    neue_melden: true            # neue Aufgaben in die Tagesübersicht
    # absender: "accounti <accounti@meine-firma.example>"   # sonst versand.absender
    empfaenger:                  # ohne Adresse landet alles in 'gemeinsam'
      jan: "jan@meine-firma.example"
      "@leitung": "chefin@meine-firma.example"
      gemeinsam: "buchhaltung@meine-firma.example"
    # webhook:
    #   url: "${ACCOUNTI_AUFGABEN_WEBHOOK}"   # http(s); Slack/Mattermost-kompatibel (Feld "text")
    #   timeout_sekunden: 10

# Versand von Ausgangsrechnungen per E-Mail (accounti rechnung senden)
versand:
  absender: "Meine Firma GmbH <rechnung@meine-firma.example>"
  bcc: "buchhaltung@meine-firma.example"   # Kopie an sich selbst (optional)
  smtp:
    host: "smtp.meine-firma.example"
    port: 587
    benutzer: "rechnung@meine-firma.example"
    passwort: "${ACCOUNTI_SMTP_PASSWORT}"   # Umgebungsvariable, nie im Klartext
    verschluesselung: starttls             # starttls, ssl oder keine
  # betreff/text überschreibbar, Platzhalter: {nummer} {firma} {datum} {faellig} {brutto} {format}

# Server
server:
  host: "127.0.0.1"
  port: 8400
