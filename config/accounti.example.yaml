# accounti Konfiguration
# Kopiere diese Datei nach config/accounti.yaml und passe sie an.

# Datenbank
database:
  url: "postgresql://accounti:accounti@localhost:5432/accounti"

# Mandant
mandant:
  name: "Meine Firma GmbH"
  kontenrahmen: SKR03          # SKR03 oder SKR04
  sachkonten_laenge: 4         # 4 oder 6

  # Für Ausgangsrechnungen (XRechnung verlangt Anschrift, Kontakt, E-Mail und Bank)
  kuerzel: "MF"                # Schlüssel des Nummernkreises (je Gesellschaft)
  anschrift:
    strasse: "Musterstraße 1"
    plz: "12345"
    ort: "Musterstadt"
    land: DE
  ust_id: "DE123456789"        # USt-IdNr. und/oder Steuernummer
  steuernummer: "12/345/67890"
  email: "rechnung@meine-firma.example"   # elektronische Adresse (BT-34)
  kontakt:
    name: "Erika Muster"
    telefon: "0123 456789"
    email: "buchhaltung@meine-firma.example"
  bank:
    iban: "DE89 3704 0044 0532 0130 00"
    bic: "COBADEFFXXX"
  oss: false                   # OSS-registriert? Dann zahlen EU-Privatkunden ihren Landessatz
  rechnung:
    nummernformat: "{jahr}-{nummer:04d}"   # lückenlos je Kürzel und Jahr
    zahlungsziel_tage: 14

# DATEV-Export
datev:
  berater_nummer: "12345"
  mandanten_nummer: "00001"
  wirtschaftsjahr_beginn: "2026-01-01"

# KI-Klassifikation
llm:
  # Provider: anthropic, openai, ollama
  provider: "anthropic"
  model: "claude-sonnet-4-20250514"
  api_key: "${ANTHROPIC_API_KEY}"    # Umgebungsvariable

  # Ab welcher Confidence automatisch buchen (0.0-1.0)?
  auto_buchen_schwelle: 0.95

  # Ab welcher Confidence zur Prüfung vorlegen (darunter = manuell)?
  pruefung_schwelle: 0.70

# Import-Einstellungen
import:
  # Standard-Bankformat (wenn --format=auto)
  standard_bank: "sparkasse"

  # Duplikaterkennung
  duplikat_check: true

# Buchhaltung (optional — ohne diesen Abschnitt gelten die Standards)
buchhaltung:
  debitoren_von: 10000         # Personenkontenkreise (SKR03 und SKR04)
  debitoren_bis: 69999
  kreditoren_von: 70000
  kreditoren_bis: 99999
  bank_konto: "1200"
  standard_aufwand: "4900"     # wenn weder Kontakt noch Regelwerk ein Sachkonto kennt (→ Prüfung)
  standard_zahlungsziel_tage: 14
  skonto_karenz_tage: 3        # Skonto gilt noch, wenn die Bank bis zu 3 Tage später bucht
  skonto_erhalten: {"19": "3736", "7": "3731", "0": "3730"}   # SKR03
  skonto_gewaehrt: {"19": "8736", "7": "8731", "0": "8730"}

# Versand von Ausgangsrechnungen per E-Mail (accounti rechnung senden)
versand:
  absender: "Meine Firma GmbH <rechnung@meine-firma.example>"
  bcc: "buchhaltung@meine-firma.example"   # Kopie an sich selbst (optional)
  smtp:
    host: "smtp.meine-firma.example"
    port: 587
    benutzer: "rechnung@meine-firma.example"
    passwort: "${ACCOUNTI_SMTP_PASSWORT}"   # Umgebungsvariable, nie im Klartext
    verschluesselung: starttls             # starttls, ssl oder keine
  # betreff/text überschreibbar, Platzhalter: {nummer} {firma} {datum} {faellig} {brutto} {format}

# Server
server:
  host: "127.0.0.1"
  port: 8400
