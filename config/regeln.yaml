# accounti — Kontierungsregeln (SKR03)
#
# Reihenfolge = Priorität: die ERSTE passende Regel gewinnt.
# Felder:
#   muster            Regex (case-insensitive)
#   feld              verwendungszweck | gegenkonto_name | beide
#   soll_konto/haben_konto, steuer_schluessel (3=USt19, 2=USt7, 9=VSt19,
#                     8=VSt8, null=ohne Steuerautomatik)
#
# Konvention:
#   Ausgabe  -> Soll = Aufwandskonto, Haben = 1200 (Bank)
#   Einnahme -> Soll = 1200 (Bank),   Haben = Erlöskonto
#
# HINWEISE (bewusst konservativ — im Zweifel prüfen):
#   * Miete: Vorsteuer nur, wenn der Vermieter zur USt optiert hat.
#   * EU-Digitalleistungen (AWS, Google, Meta ...): Reverse-Charge §13b —
#     bewusst OHNE Steuerautomatik, separat prüfen.
#   * Marktplatz-Auszahlungen sind Netto-Beträge nach Gebühren; für saubere
#     Buchung ggf. über ein Verrechnungskonto statt direkt auf Erlöse.

