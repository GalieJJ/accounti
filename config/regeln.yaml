# accounti — Kontierungsregeln (SKR03)
#
# Reihenfolge = Priorität: die ERSTE passende Regel gewinnt.
# Felder:
#   muster            Regex (case-insensitive)
#   feld              verwendungszweck | gegenkonto_name | beide
#   soll_konto/haben_konto, steuer_schluessel (3=USt19, 2=USt7, 9=VSt19,
#                     8=VSt7, null=ohne Steuerautomatik)
#   richtung          ausgabe (Betrag < 0) | einnahme (Betrag > 0) | beide.
#                     Eine Regel gilt nur für Umsätze ihrer Richtung; passt sonst
#                     keine Regel, schlägt accounti sie als Gegenbuchung vor
#                     (Erstattung mindert Aufwand und Vorsteuer, § 17 UStG) —
#                     immer zur Prüfung. Ohne richtung prüft accounti die Bankseite
#                     gegen das Vorzeichen (ebenso bei gelernten Regeln und LLM).
#   pruefen           true: Treffer immer zur Prüfung, nie automatisch gebucht
#   confidence        0–1 (Standard 1 = automatisch, ab 0,95 gebucht)
#
# Konvention:
#   Ausgabe  -> Soll = Aufwandskonto, Haben = 1200 (Bank), richtung: ausgabe
#   Einnahme -> Soll = 1200 (Bank),   Haben = Erlöskonto,  richtung: einnahme
#
# HINWEISE (bewusst konservativ — im Zweifel prüfen):
#   * Miete: steuerfrei (§ 4 Nr. 12 UStG); Vorsteuer nur, wenn der Vermieter zur
#     USt optiert hat (§ 9 UStG) und Rechnung/Mietvertrag die Steuer ausweisen —
#     deshalb ohne Schlüssel und zur Prüfung.
#   * EU-Digitalleistungen (AWS, Google, Meta ...): Reverse-Charge §13b —
#     bewusst OHNE Steuerautomatik und zur Prüfung (Schlüssel 94 setzt der Mensch).
#   * Marktplatz-/Zahlungsdienst-Auszahlungen sind Netto-Beträge nach Gebühren und
#     kein Entgelt: Bank an Verrechnungskonto ohne Umsatzsteuer. Die Erlöse bucht
#     die Abrechnung (accounti marktplatz import). Auszahlungen mit den
#     bank_stichworten der Marktplätze lässt classify ohnehin offen, bis die
#     Abrechnung sie abgleicht; diese Regeln greifen nur ohne Marktplatz-Import.

