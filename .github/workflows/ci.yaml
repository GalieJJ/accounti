name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tesseract (OCR für Belegscans)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu

      - name: Cache Prüfwerkzeuge
        uses: actions/cache@v6
        with:
          path: .pruefwerkzeuge
          key: pruefwerkzeuge-${{ hashFiles('scripts/pruefwerkzeuge_installieren.sh') }}

      - name: Install Prüfwerkzeuge (KoSIT für XRechnung, Mustang für ZUGFeRD)
        run: |
          bash scripts/pruefwerkzeuge_installieren.sh
          # Beide Werkzeuge brauchen Java 21; die Runner bringen es mit.
          JAVA="${JAVA_HOME_21_X64:-$JAVA_HOME}/bin/java"
          "$JAVA" -version
          echo "ACCOUNTI_JAVA=$JAVA" >> "$GITHUB_ENV"
          # In der CI dürfen die Prüfwerkzeug-Tests nicht still übersprungen werden.
          echo "ACCOUNTI_PRUEFWERKZEUGE_PFLICHT=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fints]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check with mypy
        run: mypy src/

      - name: Run tests
        run: pytest --cov=accounti --cov-report=term-missing

  # PostgreSQL (Plan 10c P4, M11): die ganze Suite gegen einen PostgreSQL-Dienst, damit
  # die @mit_postgresql-Tests (Trigger der Einstellungen, Migrationen, Sperren) nicht
  # nur von Hand laufen. Ausdrücklich ohne Tesseract, Prüfwerkzeuge und
  # ACCOUNTI_PRUEFWERKZEUGE_PFLICHT — diese Tests überspringen hier und laufen im Job
  # „test“, ebenso ruff, mypy und Coverage.
  postgresql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: accounti-ci  # nur für diesen Wegwerf-Dienst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ACCOUNTI_TEST_PG: postgresql+psycopg://postgres:accounti-ci@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fints]"

      - name: Run tests (mit PostgreSQL)
        run: pytest
