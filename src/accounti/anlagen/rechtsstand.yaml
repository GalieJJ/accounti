# accounti — Rechtsstand der Anlagenbuchhaltung (Stand 20.10.2026)
#
# Grenzbeträge und Sätze ändern sich mit der Gesetzgebung. Maßgeblich ist der Tag der
# Anschaffung/Herstellung/Einlage: Ein Zugang aus 2015 rechnet mit den Werten von 2015.
# Beträge sind netto (ohne abziehbare Vorsteuer). Eigene Ergänzungen in einer Datei
# gleicher Form, eingebunden über anlagen.rechtsstand in config/accounti.yaml — eigene
# Einträge gehen vor.

grenzen:
  - von: 1900-01-01
    bis: 2007-12-31
    gwg: 410
    quelle: "§ 6 Abs. 2 EStG a. F. (vor dem Unternehmensteuerreformgesetz 2008)"
  - von: 2008-01-01
    bis: 2009-12-31
    gwg: 150
    verzeichnis_ab: 150
    sammelposten_von: 150
    sammelposten_bis: 1000
    pflicht: true
    quelle: >-
      § 6 Abs. 2, 2a EStG i. d. F. des Unternehmensteuerreformgesetzes 2008:
      Sofortabzug bis 150 € und Sammelposten 150–1.000 € zwingend
  - von: 2010-01-01
    bis: 2017-12-31
    gwg: 410
    verzeichnis_ab: 150
    sammelposten_von: 150
    sammelposten_bis: 1000
    quelle: >-
      § 6 Abs. 2, 2a EStG i. d. F. des Wachstumsbeschleunigungsgesetzes vom 22.12.2009
      (BGBl. 2009 I S. 3950); BMF 30.09.2010, IV C 6 - S 2180/09/10001
  - von: 2018-01-01
    gwg: 800
    verzeichnis_ab: 250
    sammelposten_von: 250
    sammelposten_bis: 1000
    quelle: >-
      § 6 Abs. 2, 2a EStG i. d. F. des Gesetzes gegen schädliche Steuerpraktiken im
      Zusammenhang mit Rechteüberlassungen vom 27.06.2017; Wortlaut geprüft am 20.10.2026
      (gesetze-im-internet.de)

# Degressive AfA (§ 7 Abs. 2 EStG): Satz = Faktor × linearer Satz, höchstens Höchstsatz.
degressiv:
  - von: 2020-01-01
    bis: 2022-12-31
    faktor: 2.5
    hoechstsatz: 25
    quelle: >-
      § 7 Abs. 2 EStG i. d. F. vom 27.03.2024 (Zweites Corona-Steuerhilfegesetz),
      fortgeltend nach dem Investitionssofortprogramm
  - von: 2024-04-01
    bis: 2024-12-31
    faktor: 2
    hoechstsatz: 20
    quelle: "§ 7 Abs. 2 EStG i. d. F. des Wachstumschancengesetzes vom 27.03.2024"
  - von: 2025-07-01
    bis: 2027-12-31
    faktor: 3
    hoechstsatz: 30
    quelle: >-
      § 7 Abs. 2 EStG i. d. F. des Gesetzes für ein steuerliches Investitionssofortprogramm,
      verkündet 18.07.2025 (BGBl. 2025 I Nr. 161)

# Elektrofahrzeuge (§ 7 Abs. 2a EStG): Prozent der Anschaffungskosten je Jahr; im
# Anschaffungsjahr voll, auch bei unterjähriger Anschaffung.
e_fahrzeug:
  - von: 2025-07-01
    bis: 2027-12-31
    saetze: [75, 10, 5, 5, 3, 2]
    quelle: "§ 7 Abs. 2a EStG (Investitionssofortprogramm, BGBl. 2025 I Nr. 161)"

# Computerhardware und Software: Nutzungsdauer 1 Jahr, volle AfA im Anschaffungsjahr wird
# nicht beanstandet.
digital:
  - von: 2021-01-01
    quelle: >-
      BMF 22.02.2022, IV C 3 - S 2190/21/10002 :025, Rz. 1.4 (ersetzt BMF 26.02.2021);
      Wirtschaftsjahre, die nach dem 31.12.2020 enden

# Verzicht auf Rechnungsabgrenzungsposten bis zur GWG-Grenze (§ 5 Abs. 5 Satz 2 EStG),
# erstmals für Wirtschaftsjahre, die nach dem 31.12.2021 enden.
rap_verzicht:
  - von: 2021-12-31
    quelle: "§ 5 Abs. 5 Satz 2 EStG i. d. F. des JStG 2022 (BT-Drs. 20/4229)"

