# accounti — englischer Katalog der Oberfläche (Baustein 10b)
#
# Schlüssel: der deutsche Text (Quellsprache). Mehrzahl als {one, other}. Platzhalter
# %(name)s bleiben gleich (Test). Fehlt ein Eintrag, erscheint der deutsche Text.
#
# Glossar (Spec 4.5) — übersetzt, weil tragfähig:
#   Soll/Haben → Debit/Credit · Summen- und Saldenliste → Trial balance ·
#   Kontenblatt → Account ledger · offene Posten → Open items · Storno → Reversal ·
#   Vorsteuer → Input VAT · Beleg → Document · Einmalcode → One-time code ·
#   Gesellschaft → Company · Buchung → Booking · Prüfen → Review · Rückfrage → Query
# Bleiben deutsch (Fachbegriffe ohne tragfähige Entsprechung, Test):
#   Buchungssatz, BWA, Steuerschlüssel, GoBD, Festschreibung, USt-IdNr., USt-VA,
#   SKR03/SKR04, DATEV, ELSTER, ZUGFeRD, XRechnung — dazu Kontenbezeichnungen.
# Die englischen Texte hat niemand mit englischer Muttersprache durchgesehen.

