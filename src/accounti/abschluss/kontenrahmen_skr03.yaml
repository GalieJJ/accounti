  - {von: "1792", bis: "1793", art: bestand}  # Interimskonten, Verrechnung Anzahlungen
  - {von: "1795", bis: "1797", art: bestand}  # Verbindl. soziale Sicherheit, Gutscheine,
                                              # Verbindlichkeiten USt-Vorauszahlungen
  - {von: "1799", bis: "1799", art: bestand}
  - {von: "1800", bis: "1999", art: privat}
  - {von: "2000", bis: "6999", art: erfolg}
  - {von: "3970", bis: "3989", art: bestand}  # Roh-, Hilfs- und Betriebsstoffe, Waren
