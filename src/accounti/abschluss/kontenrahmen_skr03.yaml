# accounti — Abschlusszuordnung SKR03
#
# Grundlage: DATEV-Kontenrahmen SKR 03, „Gültig für 2026“ (Art.-Nr. 11174). Die Zuordnung
# zu Kennzahlen der Anlage EÜR ist eine Bereichsregel von accounti, keine DATEV-Tabelle:
# Die engste passende Spanne gewinnt. Eigene Zuordnung: abschluss.kontenzuordnung.
# Kontennamen der Einzelregeln abgeglichen mit der SKR03-Kontenliste
# (steuerschroeder.de/Kontenrahmen-SKR03-Prozessgliederungsprinzip.html, 20.10.2026).
#
# Kontoarten:
#   bestand  — wird vorgetragen
#   erfolg   — geht ins Ergebnis, startet im neuen Jahr bei 0
#   steuer   — Vorsteuer/Umsatzsteuer: bei EÜR erfolgswirksam, bei Bilanz Bestand
#   privat   — Privatkonten: werden auf das Kapitalkonto abgeschlossen
#   vortrag  — Saldenvortrags- und statistische Konten

name: SKR03
quelle: "DATEV-Kontenrahmen SKR 03, Gültig für 2026 (Art.-Nr. 11174)"

arten:
  - {von: "0000", bis: "0999", art: bestand}
  - {von: "1000", bis: "1999", art: bestand}
  - {von: "1548", bis: "1548", art: steuer}   # Vorsteuer in Folgeperiode
  - {von: "1570", bis: "1589", art: steuer}   # abziehbare Vorsteuer, EUSt
  - {von: "1770", bis: "1799", art: steuer}   # Umsatzsteuer, USt-Vorauszahlungen
  - {von: "1788", bis: "1788", art: bestand}  # Einfuhrumsatzsteuer aufgeschoben
  - {von: "1792", bis: "1793", art: bestand}  # Interimskonten, Verrechnung Anzahlungen
  - {von: "1795", bis: "1799", art: bestand}  # Verbindl. soziale Sicherheit, Gutscheine
  - {von: "1800", bis: "1999", art: privat}
  - {von: "2000", bis: "6999", art: erfolg}
  - {von: "3970", bis: "3999", art: bestand}  # Bestände
  - {von: "7000", bis: "7999", art: bestand}  # Bestände an Erzeugnissen
  - {von: "8000", bis: "8999", art: erfolg}
  - {von: "9000", bis: "9999", art: vortrag}

# Geld- und Personenkonten tragen bei Buchungen mit Steuer den Bruttobetrag
geldkonten:
  - {von: "1000", bis: "1399"}   # Kasse, Bank, Geldtransit
  - {von: "1400", bis: "1499"}   # Forderungen aus Lieferungen und Leistungen
  - {von: "1600", bis: "1699"}   # Verbindlichkeiten aus Lieferungen und Leistungen

# Bankkonten (Postbank, LZB, Bank 1200–1250): mit Bestand oder Verkehr müssen sie als
# Bankkonto eingerichtet und mit dem Kontoauszug abgestimmt sein (ohne Kasse 1000–1099,
# Finanzmittelanlagen 1290, Verbindlichkeiten ggü. Kreditinstituten 1295, Geldtransit)
bankkonten:
  - {von: "1100", bis: "1289"}

vortragskonten: {sachkonten: "9000", debitoren: "9008", kreditoren: "9009"}

# leer: SKR03-Steuerkonten kommen aus accounti.steuer
steuerkonten: {}

# Anlage EÜR: Kennzahl je Kontenbereich; kz_haben gilt bei Haben-Saldo.
# kz: null  — keine Zeile bekannt: zählt als „nicht zugeordnet“ mit (Warnung)
# kz: "-"   — gehört nicht in die EÜR (weder Betriebseinnahme noch -ausgabe, z. B.
#             Steuern vom Einkommen); erscheint nur in der Überleitung zur SuSa
euer:
  # Betriebseinnahmen
  - {von: "8000", bis: "8999", kz: "112"}   # umsatzsteuerpflichtige BE
  - {von: "8100", bis: "8199", kz: "103"}   # steuerfrei (§ 4 UStG, Ausfuhr, ig. Lieferung)
  - {von: "8190", bis: "8190", kz: "104"}   # Durchschnittssätze § 24 UStG
  - {von: "8191", bis: "8191", kz: "112"}   # §§ 25, 25a UStG 19 % USt
  - {von: "8195", bis: "8195", kz: "111"}   # Kleinunternehmer § 19 Abs. 1 UStG
  - {von: "8196", bis: "8196", kz: "112"}   # Geldspielautomaten 19 % USt
  - {von: "8320", bis: "8349", kz: "103"}   # im Inland nicht steuerbar, § 13b
  - {von: "8330", bis: "8330", kz: "112"}   # im Inland steuerpflichtige EG-Lieferungen
  - {von: "8340", bis: "8349", kz: "112"}   # Erlöse 16 % USt
  - {von: "8800", bis: "8859", kz: "102"}   # Erlöse aus Anlagenverkäufen
  - {von: "8900", bis: "8949", kz: "108"}   # unentgeltliche Wertabgaben
  - {von: "8921", bis: "8921", kz: "106"}   # private Fahrzeugnutzung 19 %
  - {von: "8924", bis: "8924", kz: "106"}   # private Fahrzeugnutzung ohne USt
  - {von: "2600", bis: "2799", kz: "103"}   # Zinserträge, sonstige Erträge
  - {von: "1770", bis: "1779", kz: "140"}   # vereinnahmte Umsatzsteuer
