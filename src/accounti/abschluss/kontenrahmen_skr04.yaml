# kz: null  — keine Zeile bekannt: zählt als „nicht zugeordnet“ mit (Warnung)
# kz: "-"   — gehört nicht in die EÜR (z. B. Steuern vom Einkommen)
# hinweis   — Text zum Konto in EÜR und Abschlussprüfung (warum ohne Zeile, was zu
#             tun ist); unbekannte Schlüssel lehnt der Lader ab

