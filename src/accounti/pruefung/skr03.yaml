# accounti — Kontenrahmen SKR03 (Auszug)
#
# Vollständiger SKR03 hat ~1.500 Konten. Dies ist ein Starterset
# mit den häufigsten Konten für E-Commerce / KMU.
#
# Quelle: DATEV-Kontenrahmen SKR 03, „Gültig für 2026“ (Art.-Nr. 11174, Stand
# 01.01.2026), https://www.datev.de/content/dam/markenassets/themen-und-produktgruppen/
# zielgruppen/mandant/unternehmer/branche/bau/11174%20SKR03%20BilrUg.pdf —
# abgeglichen am 21.10.2026: Kontenbezeichnungen, Automatikkonten (Hauptfunktion
# AV = automatische Vorsteuer, AM = automatische Umsatzsteuer) mit ihrem Steuersatz
# und die Zusatzfunktion V (Vorsteuer möglich) der Kontenbereiche.
#
# Format:
#   nummer:
#     name: Kontenbezeichnung (DATEV)
#     typ: aktiv | passiv | erloes | aufwand | sonstiges
#     bwa_zeile: BWA-Form-01-Zeile (1-23)
#     steuer:
#       schluessel: BU-Schlüssel — bei Automatikkonten der Schlüssel der Automatik,
#                   sonst der übliche Schlüssel (oder null)
#       automatik: true nur für DATEV-Automatikkonten (AV/AM)
#       vorsteuer: false, wenn das Konto laut DATEV keine Vorsteuerfunktion hat
#                  (außerhalb der V-Bereiche, z.B. Löhne, Versicherungen, AfA)
#
# Die Prüfregel steuerschluessel_konto meldet einen Fehler nur bei Automatikkonten
# (automatik: true) mit anderem Schlüssel; vorsteuer: false ergibt einen Hinweis.
# Der DATEV-Export lässt auf Automatikkonten den passenden Schlüssel weg und setzt
# ohne Steuer BU 40. Die Datei liegt im Paket (unabhängig vom Arbeitsverzeichnis);
# eine eigene setzt pruefung.kontenrahmen_datei.

